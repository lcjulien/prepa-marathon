<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prépa Marathon de Paris 2027</title>
  <meta name="description" content="Plan d'entraînement personnel pour le Marathon de Paris, le 4 avril 2027.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Prépa 3h20">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/logo.png" alt="ASICS Marathon de Paris" width="900" height="200"><span class="wm-b" id="wm-target" aria-label="Objectif">3h20</span></div>
    <button class="icon-btn" data-action="add-run" aria-label="Ajouter une sortie libre">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>
  <div class="ticker" aria-hidden="true">
    <div class="ticker-track" id="ticker"></div>
  </div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Navigation principale" id="tabs"></nav>
  <dialog id="sheet" aria-label="Détail"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript>Cette application a besoin de JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
